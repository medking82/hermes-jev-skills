name: Codex Upstream Sync

on:
  workflow_dispatch:
    inputs:
      validate_current:
        description: Test the complete pipeline even when upstream is unchanged
        type: boolean
        default: false
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: codex-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'medking82/hermes-jev-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Honor An Open Stop Notice
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Jev Upstream Sync Stopped" in:title' --json number --jq 'length')
          if [ "$count" != 0 ]; then
            echo 'blocked=true' >> "$GITHUB_OUTPUT"
            echo 'Updates are stopped. Resolve and close the stop issue before resuming.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare The Exact Candidate Without Write Credentials
        id: merge
        if: steps.gate.outputs.blocked != 'true'
        env:
          VALIDATE_CURRENT: ${{ inputs.validate_current || false }}
        run: |
          args=()
          if [ "$VALIDATE_CURRENT" = true ]; then args+=(--validate-current); fi
          python -B codex/upstream.py prepare --output "$RUNNER_TEMP/jev-sync" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: steps.merge.outputs.changed == 'true'
        with:
          name: jev-sync-candidate
          path: ${{ runner.temp }}/jev-sync/
          retention-days: 7

  verify:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9', full: true}
          - {os: ubuntu-latest, python: '3.13', full: true}
          - {os: macos-latest, python: '3.9', full: true}
          - {os: macos-latest, python: '3.13', full: true}
          - {os: windows-latest, python: '3.11', full: false}
          - {os: windows-latest, python: '3.13', full: false}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: jev-sync-candidate
          path: ${{ runner.temp }}/jev-sync/
      - name: Check Candidate Identity And Protected Controls
        shell: bash
        run: python -B codex/upstream.py verify --artifact "$RUNNER_TEMP/jev-sync" --output "$RUNNER_TEMP/unused.json"
      - run: pip install pyyaml
      - name: Test In An Isolated Profile Without Write Credentials
        shell: bash
        env:
          FULL_SUITE: ${{ matrix.full }}
        run: |
          args=()
          if [ "$FULL_SUITE" = true ]; then args+=(--full); fi
          python -B codex/check.py "${args[@]}"
      - name: Exercise Windows Git Bash Fallback
        if: runner.os == 'Windows'
        shell: bash
        run: |
          shim_dir="$(cygpath -u "$RUNNER_TEMP")/jev-python"
          mkdir -p "$shim_dir"
          printf '#!/bin/sh\nexec python "$@"\n' > "$shim_dir/python3"
          chmod +x "$shim_dir/python3"
          export PATH="$shim_dir:$PATH"
          python -m unittest discover -s tests -p test_install_fallback.py -v

  publish:
    needs: [prepare, verify]
    if: needs.prepare.outputs.changed == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: jev-sync-candidate
          path: ${{ runner.temp }}/jev-sync/
      - name: Publish Only The Tested Commit If Main Has Not Moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python -B codex/upstream.py publish --artifact "$RUNNER_TEMP/jev-sync" --output "$RUNNER_TEMP/jev-result/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: jev-sync-result
          path: ${{ runner.temp }}/jev-result/result.json
          retention-days: 90

  notify:
    needs: [prepare, verify, publish]
    if: always() && github.repository == 'medking82/hermes-jev-skills' && github.ref == 'refs/heads/main' && (needs.prepare.result == 'failure' || needs.verify.result == 'failure' || needs.publish.result == 'failure' || needs.prepare.result == 'cancelled' || needs.verify.result == 'cancelled' || needs.publish.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Stop Future Integrations And Notify The Owner Once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Jev Upstream Sync Stopped" in:title' --json number --jq 'length')
          if [ "$count" != 0 ]; then exit 0; fi
          cat > "$RUNNER_TEMP/stop.md" <<EOF
          @${GITHUB_REPOSITORY_OWNER} automatic Jev integration has stopped.

          A conflict, protected-control change, failed/cancelled test or publication error prevented completion. No untested commit is published. The local updater also stops on this notice.

          Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Resolve the failure, then explicitly close this issue to resume GitHub integration. Resume the local updater separately after checking its stop receipt. Do not bypass tests, branch protection, local edits or Codex hook trust.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title 'Jev Upstream Sync Stopped' --body-file "$RUNNER_TEMP/stop.md" --assignee "$GITHUB_REPOSITORY_OWNER"
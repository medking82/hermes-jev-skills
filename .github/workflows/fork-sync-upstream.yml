name: Sync fork with upstream

# Plain fork sync: merge kerpopule/hermes-jev-skills main and refresh the pinned official
# TypeSafe reference, push, then start test.yml for the new main. A conflict fails the run
# (GitHub emails the Owner, at most once per UTC day; later scheduled retries stay green).
# The local updater installs only a commit whose GitHub and local tests pass.
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  notice:
    if: github.repository == 'medking82/hermes-jev-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quiet: ${{ steps.check.outputs.quiet }}
    steps:
      - name: Check today's failure notice
        id: check
        uses: medking82/skills/.github/actions/upstream-sync-notice@main
        with:
          mode: check

  sync:
    needs: notice
    # A failed notice job must not skip the sync; it then reports normally.
    if: ${{ !cancelled() && github.repository == 'medking82/hermes-jev-skills' && github.ref == 'refs/heads/main' }}
    # After the day's first failure email, a scheduled retry that fails again stays green.
    continue-on-error: ${{ needs.notice.outputs.quiet == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Merge Upstream And Refresh The Official TypeSafe Reference
        id: sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -B codex/upstream.py sync
      - name: Push And Test The New Main
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:refs/heads/main
          # Pushes made with GITHUB_TOKEN start no push workflows; dispatch the tests explicitly.
          gh workflow run test.yml --ref main

  mark:
    needs: [notice, sync]
    if: ${{ !cancelled() && needs.sync.result == 'failure' && needs.notice.outputs.quiet != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remember today's failure notice
        uses: medking82/skills/.github/actions/upstream-sync-notice@main
        with:
          mode: mark
